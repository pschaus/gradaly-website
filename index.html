    <!-- Hero Section -->
    <div class="relative pt-28 pb-16 sm:pt-36 sm:pb-20 overflow-hidden"
         x-data="{
            carouselMode: 'exam',
            examSlide: 0,
            examTotal: 7,
            practiceSlide: 0,
            practiceTotal: 4,
            timer: null,
            switchMode(m) {
                this.carouselMode = m;
                this.resetTimer();
            },
            next() {
                if (this.carouselMode === 'exam') {
                    this.examSlide = (this.examSlide + 1) % this.examTotal;
                } else {
                    this.practiceSlide = (this.practiceSlide + 1) % this.practiceTotal;
                }
                this.resetTimer();
            },
            prev() {
                if (this.carouselMode === 'exam') {
                    this.examSlide = (this.examSlide - 1 + this.examTotal) % this.examTotal;
                } else {
                    this.practiceSlide = (this.practiceSlide - 1 + this.practiceTotal) % this.practiceTotal;
                }
                this.resetTimer();
            },
            goTo(i) {
                if (this.carouselMode === 'exam') {
                    this.examSlide = i;
                } else {
                    this.practiceSlide = i;
                }
                this.resetTimer();
            },
            resetTimer() {
                clearInterval(this.timer);
                this.timer = setInterval(() => {
                    if (this.carouselMode === 'exam') {
                        this.examSlide = (this.examSlide + 1) % this.examTotal;
                    } else {
                        this.practiceSlide = (this.practiceSlide + 1) % this.practiceTotal;
                    }
                }, 8000);
            }
         }"
