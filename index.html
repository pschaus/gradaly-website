<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradaly - AI Grading Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#10B981', // Emerald 500
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased" x-data="i18n()">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center space-x-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">G</div>
                    <span class="font-bold text-xl tracking-tight">Gradaly<span class="text-indigo-600">.io</span></span>
                </div>
                <div class="flex items-center space-x-4">
                    <button @click="toggleLang()" class="px-3 py-1 rounded-md bg-slate-100 hover:bg-slate-200 transition text-sm font-medium border border-slate-300">
                        <span x-text="lang === 'en' ? '🇫🇷 Français' : '🇬🇧 English'"></span>
                    </button>
                    <a href="https://github.com/pschaus/gradaly-website/releases/latest/download/Gradaly-macOS.dmg" class="hidden sm:inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition" x-text="t.nav_download"></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="relative pt-32 pb-20 sm:pt-40 sm:pb-24 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6">
                <span class="block text-slate-900" x-text="t.hero_title1"></span>
                <span class="block bg-gradient-to-r from-indigo-600 to-emerald-500 gradient-text" x-text="t.hero_title2"></span>
            </h1>
            <p class="mt-4 max-w-2xl mx-auto text-xl text-slate-600 mb-8 leading-relaxed" x-text="t.hero_subtitle"></p>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
                <a href="https://github.com/pschaus/gradaly-website/releases/latest/download/Gradaly-macOS.dmg" class="px-8 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition shadow-lg hover:shadow-xl flex items-center space-x-2">
                    <i class="fab fa-apple text-xl"></i>
                    <span x-text="t.download_mac"></span>
                </a>
                <a href="#tutorial" class="px-8 py-3 rounded-xl bg-white text-slate-700 font-semibold hover:bg-slate-50 transition border border-slate-200 shadow-sm" x-text="t.see_how"></a>
            </div>

            <!-- Architecture badge & Requirements -->
            <div class="mt-4 flex flex-wrap items-center justify-center gap-2 text-xs text-slate-500">
                <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 border border-slate-200 font-medium">
                    <i class="fab fa-apple mr-1.5 text-slate-900"></i>
                    <span x-text="t.download_sub"></span>
                </span>
                <span>•</span>
                <span x-text="t.macos_req"></span>
            </div>

            <!-- Gatekeeper Help Accordion (Hero) -->
            <div x-data="{ open: false, copied: false }" class="mt-3 max-w-lg mx-auto text-left">
                <button @click="open = !open" type="button" class="mx-auto flex items-center space-x-1.5 text-xs text-indigo-600 hover:text-indigo-800 font-medium py-1 px-2.5 rounded-lg hover:bg-indigo-50/60 transition cursor-pointer">
                    <i class="fas fa-question-circle text-amber-500"></i>
                    <span x-text="t.gatekeeper_btn"></span>
                    <i class="fas fa-chevron-down text-[10px] transition-transform duration-200" :class="{'rotate-180': open}"></i>
                </button>
                <div x-show="open" x-cloak x-transition.opacity.duration.200ms class="mt-3 p-4 bg-white border border-amber-200/80 rounded-xl text-xs text-slate-700 shadow-lg space-y-2.5">
                    <div class="flex items-center space-x-2 text-slate-900 font-semibold">
                        <i class="fas fa-shield-alt text-amber-500 text-sm"></i>
                        <span x-text="t.gatekeeper_title"></span>
                    </div>
                    <p class="text-slate-600 leading-relaxed" x-text="t.gatekeeper_desc"></p>
                    <div class="pt-1 bg-slate-50 p-3 rounded-lg border border-slate-200/70">
                        <p class="font-semibold text-slate-800 mb-2" x-text="t.gatekeeper_fix_title"></p>
                        <ul class="space-y-1.5 text-slate-600">
                            <li class="flex items-start space-x-1.5">
                                <span class="font-bold text-indigo-600">1.</span>
                                <span x-text="t.gatekeeper_step1"></span>
                            </li>
                            <li class="flex flex-col space-y-1">
                                <div class="flex items-start space-x-1.5">
                                    <span class="font-bold text-indigo-600">2.</span>
                                    <span x-text="t.gatekeeper_step2"></span>
                                </div>
                                <div class="mt-1 flex items-center bg-slate-900 text-emerald-400 font-mono text-[11px] p-2 rounded-lg justify-between shadow-inner">
                                    <code class="select-all">xattr -cr /Applications/Gradaly.app</code>
                                    <button @click="navigator.clipboard.writeText('xattr -cr /Applications/Gradaly.app'); copied = true; setTimeout(() => copied = false, 2000)" class="ml-2 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded text-[11px] border border-slate-700 transition flex items-center space-x-1 cursor-pointer">
                                        <i :class="copied ? 'fas fa-check text-emerald-400' : 'far fa-copy'"></i>
                                        <span x-text="copied ? t.copied : t.copy"></span>
                                    </button>
                                </div>
                            </li>
                            <li class="flex items-start space-x-1.5 pt-0.5">
                                <span class="font-bold text-indigo-600">3.</span>
                                <span x-text="t.gatekeeper_step3"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- Carousel -->
            <div class="mt-16 mx-auto max-w-6xl relative" x-data="{ slide: 0, timer: null }" x-init="timer = setInterval(() => slide = (slide + 1) % 3, 8000)">
                <div class="rounded-2xl border border-slate-200 shadow-2xl bg-white p-2 relative overflow-hidden">
                    
                    <div class="grid">
                        <!-- Slide 1 (Projects) -->
                        <div x-show="slide === 0" x-transition.opacity.duration.700ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="Screenshot_projects.png" alt="Vue Projets" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-8 pb-10 pt-6 bg-slate-50 rounded-b-xl border border-slate-200/80 shadow-inner">
                                <h3 class="text-2xl font-bold text-slate-900 mb-2" x-text="t.carousel_projects_title"></h3>
                                <p class="text-slate-700 text-lg font-medium leading-relaxed" x-text="t.carousel_projects_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 2 (Canevas) -->
                        <div x-show="slide === 1" x-transition.opacity.duration.700ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="Screenshot_canevas.png" alt="Vue Canevas" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-8 pb-10 pt-6 bg-indigo-50 rounded-b-xl border border-indigo-100 shadow-inner">
                                <h3 class="text-2xl font-bold text-indigo-950 mb-2" x-text="t.carousel_canevas_title"></h3>
                                <p class="text-indigo-900 text-lg font-medium leading-relaxed" x-text="t.carousel_canevas_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 3 (Grading) -->
                        <div x-show="slide === 2" x-transition.opacity.duration.700ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="Screenshot_grading.png" alt="Vue Grading" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-8 pb-10 pt-6 bg-emerald-50 rounded-b-xl border border-emerald-100 shadow-inner">
                                <h3 class="text-2xl font-bold text-emerald-950 mb-2" x-text="t.carousel_grading_title"></h3>
                                <p class="text-emerald-900 text-lg font-medium leading-relaxed" x-text="t.carousel_grading_desc"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Indicators -->
                    <div class="absolute bottom-6 right-8 flex space-x-3 z-20">
                        <button @click="slide = 0; clearInterval(timer); timer = setInterval(() => slide = (slide + 1) % 3, 8000)" :class="{'bg-slate-800 shadow-md': slide === 0, 'bg-slate-300 hover:bg-slate-400': slide !== 0}" class="w-4 h-4 rounded-full transition-colors cursor-pointer" title="Projets"></button>
                        <button @click="slide = 1; clearInterval(timer); timer = setInterval(() => slide = (slide + 1) % 3, 8000)" :class="{'bg-indigo-600 shadow-md': slide === 1, 'bg-slate-300 hover:bg-slate-400': slide !== 1}" class="w-4 h-4 rounded-full transition-colors cursor-pointer" title="Canevas"></button>
                        <button @click="slide = 2; clearInterval(timer); timer = setInterval(() => slide = (slide + 1) % 3, 8000)" :class="{'bg-emerald-600 shadow-md': slide === 2, 'bg-slate-300 hover:bg-slate-400': slide !== 2}" class="w-4 h-4 rounded-full transition-colors cursor-pointer" title="Correction"></button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Philosophy Section -->
    <div class="bg-indigo-900 text-white py-24 relative overflow-hidden" id="philosophy">
        <!-- Abstract shape -->
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-indigo-800 opacity-50 blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 rounded-full bg-indigo-800 opacity-50 blur-3xl"></div>
        
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
            <h2 class="text-3xl md:text-4xl font-bold mb-6" x-text="t.phil_title"></h2>
            <div class="w-24 h-1.5 bg-emerald-500 mx-auto mb-8 rounded-full"></div>
            <p class="text-xl md:text-2xl leading-relaxed text-indigo-100 font-light" x-text="t.phil_text"></p>
        </div>
    </div>

    <!-- Advantages Section -->
    <div class="py-24 bg-white" id="advantages">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900" x-text="t.adv_title"></h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Advantage 1 -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv1_title"></h3>
                    <p class="text-slate-600 leading-relaxed" x-text="t.adv1_text"></p>
                </div>
                <!-- Advantage 2 (Privacy) -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-user-secret"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv_privacy_title"></h3>
                    <p class="text-slate-600 leading-relaxed" x-text="t.adv_privacy_text"></p>
                </div>
                <!-- Advantage 3 (Cost) -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-piggy-bank"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv_cost_title"></h3>
                    <p class="text-slate-600 leading-relaxed" x-text="t.adv_cost_text"></p>
                </div>
                <!-- Advantage 4 (Control) -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-user-check"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv_control_title"></h3>
                    <p class="text-slate-600 leading-relaxed" x-text="t.adv_control_text"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Tutorial Section -->
    <div class="py-24 bg-slate-50 border-t border-slate-200" id="tutorial">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900" x-text="t.tut_title"></h2>
                <p class="mt-4 text-xl text-slate-600" x-text="t.tut_subtitle"></p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 relative">
                <!-- Connecting Line for desktop -->
                <div class="hidden md:block absolute top-8 left-10 right-10 h-0.5 bg-indigo-200 z-0"></div>
                
                <!-- Step 1 -->
                <div class="relative text-center z-10 group">
                    <div class="w-16 h-16 mx-auto bg-white border-4 border-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl font-bold mb-6 group-hover:border-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition duration-300">1</div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.tut1_title"></h3>
                    <p class="text-slate-600" x-text="t.tut1_text"></p>
                </div>
                <!-- Step 2 -->
                <div class="relative text-center z-10 group">
                    <div class="w-16 h-16 mx-auto bg-white border-4 border-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl font-bold mb-6 group-hover:border-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition duration-300">2</div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.tut2_title"></h3>
                    <p class="text-slate-600" x-text="t.tut2_text"></p>
                </div>
                <!-- Step 3 -->
                <div class="relative text-center z-10 group">
                    <div class="w-16 h-16 mx-auto bg-white border-4 border-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl font-bold mb-6 group-hover:border-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition duration-300">3</div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.tut3_title"></h3>
                    <p class="text-slate-600" x-text="t.tut3_text"></p>
                </div>
                <!-- Step 4 -->
                <div class="relative text-center z-10 group">
                    <div class="w-16 h-16 mx-auto bg-white border-4 border-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-2xl font-bold mb-6 group-hover:border-emerald-500 group-hover:bg-emerald-500 group-hover:text-white transition duration-300">4</div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.tut4_title"></h3>
                    <p class="text-slate-600" x-text="t.tut4_text"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- CTA Section -->
    <div class="bg-white py-24" id="download">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-6" x-text="t.cta_title"></h2>
            <p class="text-xl text-slate-600 mb-10" x-text="t.cta_subtitle"></p>
            <a href="https://github.com/pschaus/gradaly-website/releases/latest/download/Gradaly-macOS.dmg" class="inline-flex px-8 py-4 rounded-xl bg-indigo-600 text-white font-bold text-lg hover:bg-indigo-700 transition shadow-lg hover:shadow-xl items-center space-x-3">
                <i class="fab fa-apple text-2xl"></i>
                <span x-text="t.download_mac"></span>
            </a>
            
            <!-- Architecture badge & Requirements -->
            <div class="mt-4 flex flex-wrap items-center justify-center gap-2 text-xs sm:text-sm text-slate-500">
                <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 border border-slate-200 font-medium">
                    <i class="fab fa-apple mr-1.5 text-slate-900"></i>
                    <span x-text="t.download_sub"></span>
                </span>
                <span>•</span>
                <span x-text="t.macos_req"></span>
                <span>•</span>
                <span class="text-slate-500" x-text="t.intel_windows_note"></span>
            </div>

            <!-- Gatekeeper Help Accordion (CTA) -->
            <div x-data="{ open: false, copied: false }" class="mt-4 max-w-lg mx-auto text-left">
                <button @click="open = !open" type="button" class="mx-auto flex items-center space-x-1.5 text-xs text-indigo-600 hover:text-indigo-800 font-medium py-1 px-2.5 rounded-lg hover:bg-indigo-50/60 transition cursor-pointer">
                    <i class="fas fa-question-circle text-amber-500"></i>
                    <span x-text="t.gatekeeper_btn"></span>
                    <i class="fas fa-chevron-down text-[10px] transition-transform duration-200" :class="{'rotate-180': open}"></i>
                </button>
                <div x-show="open" x-cloak x-transition.opacity.duration.200ms class="mt-3 p-4 bg-slate-50 border border-amber-200/80 rounded-xl text-xs text-slate-700 shadow-md space-y-2.5">
                    <div class="flex items-center space-x-2 text-slate-900 font-semibold">
                        <i class="fas fa-shield-alt text-amber-500 text-sm"></i>
                        <span x-text="t.gatekeeper_title"></span>
                    </div>
                    <p class="text-slate-600 leading-relaxed" x-text="t.gatekeeper_desc"></p>
                    <div class="pt-1 bg-white p-3 rounded-lg border border-slate-200">
                        <p class="font-semibold text-slate-800 mb-2" x-text="t.gatekeeper_fix_title"></p>
                        <ul class="space-y-1.5 text-slate-600">
                            <li class="flex items-start space-x-1.5">
                                <span class="font-bold text-indigo-600">1.</span>
                                <span x-text="t.gatekeeper_step1"></span>
                            </li>
                            <li class="flex flex-col space-y-1">
                                <div class="flex items-start space-x-1.5">
                                    <span class="font-bold text-indigo-600">2.</span>
                                    <span x-text="t.gatekeeper_step2"></span>
                                </div>
                                <div class="mt-1 flex items-center bg-slate-900 text-emerald-400 font-mono text-[11px] p-2 rounded-lg justify-between shadow-inner">
                                    <code class="select-all">xattr -cr /Applications/Gradaly.app</code>
                                    <button @click="navigator.clipboard.writeText('xattr -cr /Applications/Gradaly.app'); copied = true; setTimeout(() => copied = false, 2000)" class="ml-2 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded text-[11px] border border-slate-700 transition flex items-center space-x-1 cursor-pointer">
                                        <i :class="copied ? 'fas fa-check text-emerald-400' : 'far fa-copy'"></i>
                                        <span x-text="copied ? t.copied : t.copy"></span>
                                    </button>
                                </div>
                            </li>
                            <li class="flex items-start space-x-1.5 pt-0.5">
                                <span class="font-bold text-indigo-600">3.</span>
                                <span x-text="t.gatekeeper_step3"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-2 mb-4 md:mb-0">
                <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">G</div>
                <span class="text-white font-semibold tracking-tight text-xl">Gradaly<span class="text-indigo-400">.io</span></span>
            </div>
            <p class="text-sm">© 2026 Gradaly.io. <span x-text="t.footer_rights"></span></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
