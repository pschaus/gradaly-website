<body class="bg-slate-50 text-slate-900 font-sans antialiased" x-data="i18n()">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center space-x-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">G</div>
                    <span class="font-bold text-xl tracking-tight">Gradaly<span class="text-indigo-600">.io</span></span>
                </div>
                <div class="flex items-center space-x-4">

                    <button @click="toggleLang()" class="px-3 py-1 rounded-md bg-slate-100 hover:bg-slate-200 transition text-sm font-medium border border-slate-300">

                    <a href="#download" class="hidden sm:inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition" x-text="t.nav_download"></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="relative pt-32 pb-16 sm:pt-40 sm:pb-20 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6">
                <span class="block text-slate-900" x-text="t.hero_title1"></span>
                <span class="block bg-gradient-to-r from-indigo-600 to-emerald-500 gradient-text" x-text="t.hero_title2"></span>
            </h1>
            <p class="mt-4 max-w-3xl mx-auto text-lg sm:text-xl text-slate-600 mb-8 leading-relaxed" x-text="t.hero_subtitle"></p>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
                <a href="https://github.com/pschaus/gradaly-website/releases/latest/download/Gradaly-macOS.dmg" class="px-7 py-3.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition shadow-lg hover:shadow-xl flex items-center space-x-2">
                    <i class="fab fa-apple text-xl"></i>
                    <span x-text="t.download_mac"></span>
                </a>
                <a href="https://github.com/pschaus/gradaly-website/releases/latest/download/Gradaly-Linux.AppImage" class="px-7 py-3.5 rounded-xl bg-slate-900 text-white font-semibold hover:bg-slate-800 transition shadow-lg hover:shadow-xl flex items-center space-x-2">
                    <i class="fab fa-linux text-xl"></i>
                    <span x-text="t.download_appimage"></span>

                <a href="#tutorial" class="px-7 py-3.5 rounded-xl bg-white text-slate-700 font-semibold hover:bg-slate-50 transition border border-slate-200 shadow-sm" x-text="t.see_how"></a>
            </div>

            <!-- Architecture badge & Requirements -->
            <div class="mt-4 flex flex-wrap items-center justify-center gap-2 text-xs text-slate-500">
                <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 border border-slate-200 font-medium">
                    <i class="fab fa-apple mr-1.5 text-slate-900"></i>
                    <span x-text="t.download_sub_mac"></span>
                </span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium">
                    <i class="fas fa-check-circle mr-1.5 text-emerald-600"></i>
                    <span x-text="t.apple_notarized_badge"></span>
                </span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 border border-slate-200 font-medium">
                    <i class="fab fa-linux mr-1.5 text-slate-900"></i>
                    <span x-text="t.download_sub_linux"></span>
                </span>

                 x-data="{ 
                    slide: 0, 
                    total: 8, 
                    timer: null,
                    next() { this.slide = (this.slide + 1) % this.total; this.resetTimer(); },
                    prev() { this.slide = (this.slide - 1 + this.total) % this.total; this.resetTimer(); },
                    goTo(i) { this.slide = i; this.resetTimer(); },
                    resetTimer() { clearInterval(this.timer); this.timer = setInterval(() => this.slide = (this.slide + 1) % this.total, 8000); }
                 }" 
                 x-init="resetTimer()">

                <div class="rounded-2xl border border-slate-200 shadow-2xl bg-white p-2 relative overflow-hidden group">
                    
                    <div class="grid">
                        <!-- Slide 0: Welcome & Projects -->
                        <div x-show="slide === 0" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="00_welcome_projects.png" alt="Accueil et Projets" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-slate-50 rounded-b-xl border-t border-slate-200 text-left">

                                <h3 class="text-xl sm:text-2xl font-bold text-slate-900 mb-1" x-text="t.carousel_slide0_title"></h3>
                                <p class="text-slate-600 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide0_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 1: Identification Zone on Canvas -->
                        <div x-show="slide === 1" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="01_name_zone_canevas.png" alt="Zone d'identification et Canevas" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-indigo-50/50 rounded-b-xl border-t border-indigo-100 text-left">
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 mb-1" x-text="t.carousel_slide1_badge"></span>
                                <h3 class="text-xl sm:text-2xl font-bold text-indigo-950 mb-1" x-text="t.carousel_slide1_title"></h3>
                                <p class="text-indigo-900/80 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide1_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 2: Questions, Rubrics & Prompts -->
                        <div x-show="slide === 2" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="02_questions_config_ai_prompt.png" alt="Questions, Barème et Prompt IA" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-indigo-50/50 rounded-b-xl border-t border-indigo-100 text-left">
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 mb-1" x-text="t.carousel_slide2_badge"></span>
                                <h3 class="text-xl sm:text-2xl font-bold text-indigo-950 mb-1" x-text="t.carousel_slide2_title"></h3>
                                <p class="text-indigo-900/80 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide2_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 3: Students Roster Import -->
                        <div x-show="slide === 3" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="03_students_import.png" alt="Import Étudiants CSV" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-blue-50/50 rounded-b-xl border-t border-blue-100 text-left">
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-blue-100 text-blue-700 mb-1" x-text="t.carousel_slide3_badge"></span>
                                <h3 class="text-xl sm:text-2xl font-bold text-blue-950 mb-1" x-text="t.carousel_slide3_title"></h3>
                                <p class="text-blue-900/80 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide3_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 4: Copy Matching -->
                        <div x-show="slide === 4" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="06_copy_student_matching_view.png" alt="Appariement des Copies" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-emerald-50/50 rounded-b-xl border-t border-emerald-100 text-left">
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-100 text-emerald-700 mb-1" x-text="t.carousel_slide4_badge"></span>
                                <h3 class="text-xl sm:text-2xl font-bold text-emerald-950 mb-1" x-text="t.carousel_slide4_title"></h3>
                                <p class="text-emerald-900/80 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide4_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 5: Grading Station -->
                        <div x-show="slide === 5" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="04_copy_import_and_grading_view.png" alt="Poste d'évaluation et Visualiseur" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-slate-50 rounded-b-xl border-t border-slate-200 text-left">
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-slate-200 text-slate-700 mb-1" x-text="t.carousel_slide5_badge"></span>
                                <h3 class="text-xl sm:text-2xl font-bold text-slate-900 mb-1" x-text="t.carousel_slide5_title"></h3>
                                <p class="text-slate-600 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide5_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 6: AI Grading & Feedback -->
                        <div x-show="slide === 6" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="05_ai_grading.png" alt="Évaluation assistée par IA Gemini" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-purple-50/50 rounded-b-xl border-t border-purple-100 text-left">
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-purple-100 text-purple-700 mb-1" x-text="t.carousel_slide6_badge"></span>
                                <h3 class="text-xl sm:text-2xl font-bold text-purple-950 mb-1" x-text="t.carousel_slide6_title"></h3>
                                <p class="text-purple-900/80 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide6_desc"></p>
                            </div>
                        </div>

                        <!-- Slide 7: Analytics & Export -->
                        <div x-show="slide === 7" x-transition.opacity.duration.600ms class="flex flex-col" style="grid-area: 1 / 1;">
                            <img src="07_statistics_view.png" alt="Synthèse statistique et Export Excel" class="rounded-xl w-full shadow-inner border border-slate-200 mb-0">
                            <div class="px-6 sm:px-8 pb-8 pt-5 bg-amber-50/50 rounded-b-xl border-t border-amber-100 text-left">
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-100 text-amber-800 mb-1" x-text="t.carousel_slide7_badge"></span>
                                <h3 class="text-xl sm:text-2xl font-bold text-amber-950 mb-1" x-text="t.carousel_slide7_title"></h3>
                                <p class="text-amber-900/80 text-sm sm:text-base leading-relaxed" x-text="t.carousel_slide7_desc"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Left / Right Navigation Arrows -->
                    <button @click="prev()" type="button" class="absolute left-4 top-1/3 -translate-y-1/2 w-11 h-11 rounded-full bg-slate-900/60 hover:bg-slate-900/80 text-white backdrop-blur-md flex items-center justify-center transition shadow-lg opacity-80 hover:opacity-100 cursor-pointer z-20">
                        <i class="fas fa-chevron-left text-base"></i>
                    </button>
                    <button @click="next()" type="button" class="absolute right-4 top-1/3 -translate-y-1/2 w-11 h-11 rounded-full bg-slate-900/60 hover:bg-slate-900/80 text-white backdrop-blur-md flex items-center justify-center transition shadow-lg opacity-80 hover:opacity-100 cursor-pointer z-20">
                        <i class="fas fa-chevron-right text-base"></i>
                    </button>

                    <!-- Dot Indicators -->
                    <div class="absolute bottom-4 right-6 flex items-center space-x-1.5 z-20 bg-white/80 backdrop-blur-xs px-2.5 py-1.5 rounded-full border border-slate-200/80 shadow-xs">
                        <template x-for="i in 8" :key="i">
                            <button @click="goTo(i - 1)" 
                                    :class="{'w-6 bg-indigo-600': slide === (i - 1), 'w-2 bg-slate-300 hover:bg-slate-400': slide !== (i - 1)}" 
                                    class="h-2 rounded-full transition-all duration-300 cursor-pointer"></button>
                        </template>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Philosophy Section -->
    <div class="bg-indigo-900 text-white py-20 relative overflow-hidden" id="philosophy">
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-indigo-800 opacity-50 blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 rounded-full bg-indigo-800 opacity-50 blur-3xl"></div>
        
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
            <h2 class="text-3xl md:text-4xl font-bold mb-4" x-text="t.phil_title"></h2>
            <div class="w-24 h-1.5 bg-emerald-500 mx-auto mb-6 rounded-full"></div>
            <p class="text-lg sm:text-xl leading-relaxed text-indigo-100 font-light" x-text="t.phil_text"></p>
        </div>
    </div>

    <!-- Advantages Section -->
    <div class="py-20 bg-white" id="advantages">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900" x-text="t.adv_title"></h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Advantage 1: Native App -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-desktop"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv1_title"></h3>
                    <p class="text-slate-600 leading-relaxed text-sm" x-text="t.adv1_text"></p>
                </div>
                <!-- Advantage 2: Total Privacy -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-user-secret"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv_privacy_title"></h3>
                    <p class="text-slate-600 leading-relaxed text-sm" x-text="t.adv_privacy_text"></p>
                </div>
                <!-- Advantage 3: Cost Control -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-piggy-bank"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv_cost_title"></h3>
                    <p class="text-slate-600 leading-relaxed text-sm" x-text="t.adv_cost_text"></p>
                </div>
                <!-- Advantage 4: Control & Final Say -->
                <div class="p-8 bg-slate-50 rounded-3xl border border-slate-100 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                    <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-user-check"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-slate-900" x-text="t.adv_control_title"></h3>
                    <p class="text-slate-600 leading-relaxed text-sm" x-text="t.adv_control_text"></p>
                </div>
            </div>

            <!-- Privacy & Architecture Callout (Light, elegant & reassuring) -->
            <div class="mt-12 max-w-4xl mx-auto p-5 sm:p-6 bg-slate-50 border border-slate-200/80 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center gap-4 text-left">
                <div class="w-11 h-11 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="flex-1 text-sm">
                    <div class="flex flex-wrap items-center gap-2 mb-1">
                        <h4 class="font-bold text-slate-900 text-base" x-text="t.privacy_banner_title"></h4>
                        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200" x-text="t.privacy_banner_badge"></span>
                    </div>
                    <p class="text-slate-600 leading-relaxed" x-text="t.privacy_banner_desc"></p>
                </div>
            </div>
        </div>
    </div>

            <div class="text-center max-w-3xl mx-auto mb-16">
                <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 border border-indigo-200 mb-3">

                    <span>Workflow Guidé</span>
                </span>
                <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight" x-text="t.guide_title"></h2>
                <p class="mt-4 text-base sm:text-lg text-slate-600 leading-relaxed" x-text="t.guide_subtitle"></p>
            </div>
            
            <div class="space-y-8">
                <!-- Step 1 Card -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-md hover:shadow-lg transition">
                    <div class="flex items-start gap-4 mb-4">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white font-extrabold text-xl flex items-center justify-center shrink-0 shadow-md">
                            1
                        </div>
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600" x-text="t.guide_step1_tag"></span>
                            <h3 class="text-xl sm:text-2xl font-bold text-slate-900" x-text="t.guide_step1_title"></h3>

                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">

                                <i class="fas fa-id-badge text-indigo-600 text-xs"></i>
                                <span x-text="t.guide_step1_item1_title"></span>
                            </h4>

                                <span x-text="t.guide_step1_item2_title"></span>
                            </h4>
                            <p class="text-xs text-slate-600 leading-relaxed" x-text="t.guide_step1_item2_desc"></p>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <h4 class="font-bold text-slate-900 text-sm flex items-center gap-2 mb-1.5">
                                <i class="fas fa-list-check text-indigo-600 text-xs"></i>
                                <span x-text="t.guide_step1_item3_title"></span>
                            </h4>
                            <p class="text-xs text-slate-600 leading-relaxed" x-text="t.guide_step1_item3_desc"></p>

                        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <h4 class="font-bold text-slate-900 text-sm flex items-center gap-2 mb-1.5">
                                <i class="fas fa-robot text-indigo-600 text-xs"></i>
