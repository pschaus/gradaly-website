<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradaly.io — User Manual / Manuel Utilisateur (v3.0.1)</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-600 selection:text-white" x-data="manualApp()" x-init="init()">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <a href="index.html" class="flex items-center space-x-2 group">
                        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl group-hover:bg-indigo-700 transition">G</div>
                        <span class="font-bold text-xl tracking-tight text-slate-900">Gradaly<span class="text-indigo-600">.io</span></span>
                    </a>
                    <span class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200" x-text="t.badge_manual"></span>
                    <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold font-mono bg-slate-100 text-slate-700 border border-slate-200">v3.0.1</span>
                </div>

                <div class="flex items-center space-x-3">
                    <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
                        <i class="fas fa-arrow-left text-xs"></i>
                        <span x-text="t.back_home"></span>
                    </a>
                    <button @click="toggleLang()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 transition text-sm font-semibold border border-slate-300 cursor-pointer">
                        <span x-text="lang === 'en' ? '🇫🇷 Français' : '🇬🇧 English'"></span>
                    </button>
                    <a href="index.html#download" class="hidden sm:inline-flex items-center justify-center px-4 py-2 rounded-lg shadow-xs text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition" x-text="t.download_btn"></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Banner -->
    <header class="pt-28 pb-12 bg-gradient-to-b from-indigo-950 via-slate-900 to-slate-900 text-white border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="max-w-3xl">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 mb-4">
                    <i class="fas fa-book-open"></i>
                    <span x-text="t.hero_pill"></span>
                </div>
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4" x-text="t.hero_title"></h1>
                <p class="text-base sm:text-lg text-slate-300 leading-relaxed mb-6" x-text="t.hero_subtitle"></p>

                <!-- Search input -->
                <div class="relative max-w-xl">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text"
                           x-model="search"
                           :placeholder="t.search_placeholder"
                           class="w-full pl-11 pr-10 py-3 rounded-xl bg-slate-800/90 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button x-show="search.length > 0"
                            @click="search = ''"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs px-2 py-1">
                        ✕
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout: Sidebar + Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col lg:flex-row gap-10">

            <!-- Sticky Sidebar Table of Contents -->
            <aside class="lg:w-72 shrink-0">
                <div class="lg:sticky lg:top-24 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3" x-text="t.toc_title"></div>
                    <nav class="space-y-1 text-sm">
                        <template x-for="(sec, idx) in t.sections" :key="sec.id">
                            <a :href="'#' + sec.id"
                               class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition">
                                <span class="w-5 h-5 rounded-md bg-indigo-50 text-indigo-700 font-bold text-xs flex items-center justify-center shrink-0" x-text="idx + 1"></span>
                                <span class="truncate" x-text="sec.shortTitle"></span>
                            </a>
                        </template>
                    </nav>

                    <div class="mt-6 pt-5 border-t border-slate-100">
                        <div class="p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-100 text-xs text-indigo-950 space-y-2">
                            <div class="font-bold flex items-center gap-1.5 text-indigo-700">
                                <i class="fas fa-shield-alt"></i>
                                <span x-text="t.privacy_box_title"></span>
                            </div>
                            <p class="leading-relaxed text-slate-600" x-text="t.privacy_box_text"></p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Documentation Chapters -->
            <main class="flex-1 space-y-14 min-w-0">

                <template x-for="(sec, idx) in filteredSections" :key="sec.id">
                    <section :id="sec.id" class="scroll-mt-24 bg-white rounded-3xl border border-slate-200/90 shadow-sm overflow-hidden">
                        <!-- Section Header -->
                        <div class="px-6 sm:px-8 py-6 bg-slate-50/80 border-b border-slate-200/80 flex items-start gap-4">
                            <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white font-extrabold text-lg flex items-center justify-center shrink-0 shadow-sm" x-text="sec.stepNumber"></div>
                            <div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-600" x-text="sec.tag"></span>
                                    <template x-if="sec.badge">
                                        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200" x-text="sec.badge"></span>
                                    </template>
                                </div>
                                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-0.5" x-text="sec.title"></h2>
                                <p class="text-sm sm:text-base text-slate-600 mt-1" x-text="sec.subtitle"></p>
                            </div>
                        </div>

                        <!-- Section Body -->
                        <div class="p-6 sm:p-8 space-y-6">
                            <!-- Overview paragraphs -->
                            <div class="space-y-3 text-slate-700 text-sm sm:text-base leading-relaxed">
                                <template x-for="(p, pIdx) in sec.paragraphs" :key="pIdx">
                                    <p x-html="p"></p>
                                </template>
                            </div>

                            <!-- Dynamic Language Screenshot(s) -->
                            <template x-if="sec.screenshots && sec.screenshots.length > 0">
                                <div class="space-y-6 pt-2">
                                    <template x-for="(shot, sIdx) in sec.screenshots" :key="sIdx">
                                        <figure class="rounded-2xl border border-slate-200 bg-slate-900/5 p-2 sm:p-3 shadow-md">
                                            <div class="flex items-center justify-between px-2 pb-2 text-xs text-slate-500">
                                                <span class="font-semibold text-slate-700 flex items-center gap-1.5">
                                                    <i class="fas fa-desktop text-indigo-600"></i>
                                                    <span x-text="shot.caption"></span>
                                                </span>
                                                <span class="font-mono text-[11px] px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-600" x-text="lang === 'fr' ? 'Interface FR' : 'EN Interface'"></span>
                                            </div>
                                            <img :src="'manual-assets/' + shot.filePrefix + '_' + lang + '.png'"
                                                 :alt="shot.caption"
                                                 loading="lazy"
                                                 class="w-full rounded-xl border border-slate-200 shadow-sm bg-white">
                                        </figure>
                                    </template>
                                </div>
                            </template>

                            <!-- Numbered Key Callouts / Bullets -->
                            <template x-if="sec.callouts && sec.callouts.length > 0">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                    <template x-for="(c, cIdx) in sec.callouts" :key="cIdx">
                                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-start gap-3">
                                            <span class="w-6 h-6 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center shrink-0 mt-0.5" x-text="cIdx + 1"></span>
                                            <div class="text-xs sm:text-sm">
                                                <div class="font-bold text-slate-900 mb-0.5" x-text="c.title"></div>
                                                <p class="text-slate-600 leading-relaxed" x-html="c.desc"></p>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Provider API Key Creation Cards -->
                            <template x-if="sec.providerGuides && sec.providerGuides.length > 0">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2">
                                    <template x-for="(pg, pgIdx) in sec.providerGuides" :key="pgIdx">
                                        <div class="p-5 rounded-2xl border border-slate-200 bg-slate-50/70 flex flex-col justify-between space-y-3">
                                            <div class="space-y-2">
                                                <div class="flex items-center justify-between gap-2">
                                                    <h3 class="font-extrabold text-slate-900 text-base flex items-center gap-2">
                                                        <i :class="pg.icon" class="text-indigo-600"></i>
                                                        <span x-text="pg.name"></span>
                                                    </h3>
                                                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-indigo-100 text-indigo-800 border border-indigo-200" x-text="pg.tag"></span>
                                                </div>
                                                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed" x-html="pg.desc"></p>
                                                <ol class="list-decimal list-inside space-y-1 text-xs text-slate-700 pt-1">
                                                    <template x-for="(st, stIdx) in pg.steps" :key="stIdx">
                                                        <li x-html="st"></li>
                                                    </template>
                                                </ol>
                                            </div>
                                            <template x-if="pg.url">
                                                <div class="pt-2 border-t border-slate-200/80">
                                                    <a :href="pg.url" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition">
                                                        <span x-text="pg.linkLabel"></span>
                                                        <i class="fas fa-external-link-alt text-[10px]"></i>
                                                    </a>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Comparison Table -->
                            <template x-if="sec.comparisonTable">
                                <div class="pt-3 overflow-x-auto">
                                    <h3 class="text-lg font-extrabold text-slate-900 mb-3" x-text="sec.comparisonTable.title"></h3>
                                    <div class="rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                                        <table class="w-full text-left border-collapse text-xs sm:text-sm">
                                            <thead>
                                                <tr class="bg-slate-900 text-white">
                                                    <template x-for="(col, colIdx) in sec.comparisonTable.headers" :key="colIdx">
                                                        <th class="py-3.5 px-4 font-bold border-b border-slate-800" :class="colIdx === 1 ? 'bg-indigo-700 text-white' : ''" x-text="col"></th>
                                                    </template>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-200 bg-white">
                                                <template x-for="(row, rIdx) in sec.comparisonTable.rows" :key="rIdx">
                                                    <tr class="hover:bg-slate-50/80 transition">
                                                        <td class="py-3 px-4 font-bold text-slate-900 bg-slate-50/60" x-text="row[0]"></td>
                                                        <td class="py-3 px-4 font-semibold text-indigo-950 bg-indigo-50/40" x-html="row[1]"></td>
                                                        <td class="py-3 px-4 text-slate-700" x-html="row[2]"></td>
                                                        <td class="py-3 px-4 text-slate-700" x-html="row[3]"></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </template>

                            <!-- FAQ Cards -->
                            <template x-if="sec.faqs && sec.faqs.length > 0">
                                <div class="space-y-4 pt-2">
                                    <template x-for="(faq, fIdx) in sec.faqs" :key="fIdx">
                                        <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-2">
                                            <h3 class="text-base font-extrabold text-slate-900 flex items-start gap-2.5">
                                                <span class="w-6 h-6 rounded-lg bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">Q</span>
                                                <span x-text="faq.q"></span>
                                            </h3>
                                            <div class="pl-8 text-xs sm:text-sm text-slate-700 leading-relaxed space-y-2" x-html="faq.a"></div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Pedagogical Tip Box -->
                            <template x-if="sec.tip">
                                <div class="p-4 sm:p-5 rounded-2xl bg-amber-50/80 border border-amber-200/90 flex items-start gap-3.5 text-xs sm:text-sm text-amber-950">
                                    <i class="fas fa-lightbulb text-amber-600 text-lg shrink-0 mt-0.5"></i>
                                    <div>
                                        <div class="font-bold mb-0.5" x-text="sec.tip.title"></div>
                                        <p class="leading-relaxed text-amber-900/90" x-text="sec.tip.text"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </section>
                </template>

            </main>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm">
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">G</div>
                <span class="font-bold text-white">Gradaly.io</span>
                <span class="text-xs text-slate-500">— v3.0.1</span>
            </div>
            <div class="flex items-center gap-6">
                <a href="index.html" class="hover:text-white transition" x-text="t.back_home"></a>
                <a href="index.html#download" class="hover:text-white transition" x-text="t.download_btn"></a>
            </div>
        </div>
    </footer>

    <script src="manual.js"></script>
</body>
</html>
