<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradaly.io — User Manual / Manuel Utilisateur (v3.0.2)</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-600 selection:text-white" x-data="manualApp()" x-init="init()">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <a href="index.html" class="flex items-center space-x-2 group">
                        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl group-hover:bg-indigo-700 transition">G</div>
                        <span class="font-bold text-xl tracking-tight text-slate-900">Gradaly<span class="text-indigo-600">.io</span></span>
                    </a>
                    <span class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200" x-text="t.badge_manual"></span>
                    <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold font-mono bg-slate-100 text-slate-700 border border-slate-200">v3.0.2</span>
                </div>

                <div class="flex items-center space-x-3">
                    <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
                        <i class="fas fa-arrow-left text-xs"></i>
                        <span x-text="t.back_home"></span>
                    </a>
                    <button @click="toggleLang()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 transition text-sm font-semibold border border-slate-300 cursor-pointer">
                        <span x-text="lang === 'en' ? '🇫🇷 Français' : '🇬🇧 English'"></span>
                    </button>
                    <a href="index.html#download" class="hidden sm:inline-flex items-center justify-center px-4 py-2 rounded-lg shadow-xs text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition" x-text="t.download_btn"></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Banner with 2-in-1 Product Guide Switcher -->
    <header class="pt-28 pb-10 bg-gradient-to-b from-indigo-950 via-slate-900 to-slate-900 text-white border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
                <div class="max-w-3xl">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 mb-4">
                        <i class="fas fa-layer-group"></i>
                        <span x-text="t.hero_pill"></span>
                    </div>
                    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-3" x-text="t.hero_title"></h1>
                    <p class="text-base sm:text-lg text-slate-300 leading-relaxed" x-text="t.hero_subtitle"></p>
                </div>

                <!-- Search input -->
                <div class="relative w-full lg:w-96 shrink-0">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text"
                           x-model="search"
                           :placeholder="t.search_placeholder"
                           class="w-full pl-11 pr-10 py-3 rounded-xl bg-slate-800/90 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button x-show="search.length > 0"
                            @click="search = ''"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs px-2 py-1">
                        ✕
                    </button>
                </div>
            </div>

            <!-- 2-in-1 Product Selector Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Manual 1: Exam Grading Mode (Enseignant) -->
                <button type="button"
                        @click="selectGuide('exam')"
                        :class="activeGuide === 'exam' ? 'ring-2 ring-indigo-400 bg-indigo-950/90 border-indigo-400 shadow-xl' : 'bg-slate-800/60 hover:bg-slate-800/90 border-slate-700/80 opacity-85 hover:opacity-100'"
                        class="text-left p-5 rounded-2xl border transition-all cursor-pointer flex items-start gap-4 group">
                    <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-xl shrink-0 shadow-md group-hover:scale-105 transition">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase tracking-wider bg-indigo-500/30 text-indigo-200 border border-indigo-400/40" x-text="t.card_exam_badge"></span>
                        </div>
                        <h2 class="text-lg sm:text-xl font-extrabold text-white" x-text="t.card_exam_title"></h2>
                        <p class="text-xs sm:text-sm text-slate-300 mt-1 leading-relaxed" x-text="t.card_exam_desc"></p>
                    </div>
                </button>

                <!-- Manual 2: Practice & Self-Assessment QR Mode (Étudiant) -->
                <button type="button"
                        @click="selectGuide('practice')"
                        :class="activeGuide === 'practice' ? 'ring-2 ring-teal-400 bg-teal-950/90 border-teal-400 shadow-xl' : 'bg-slate-800/60 hover:bg-slate-800/90 border-slate-700/80 opacity-85 hover:opacity-100'"
                        class="text-left p-5 rounded-2xl border transition-all cursor-pointer flex items-start gap-4 group">
                    <div class="w-12 h-12 rounded-2xl bg-teal-600 text-white flex items-center justify-center text-xl shrink-0 shadow-md group-hover:scale-105 transition">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase tracking-wider bg-teal-500/30 text-teal-200 border border-teal-400/40" x-text="t.card_practice_badge"></span>
                        </div>
                        <h2 class="text-lg sm:text-xl font-extrabold text-white" x-text="t.card_practice_title"></h2>
                        <p class="text-xs sm:text-sm text-slate-300 mt-1 leading-relaxed" x-text="t.card_practice_desc"></p>
                    </div>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout: Sidebar + Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col lg:flex-row gap-10">

            <!-- Sticky Sidebar Table of Contents -->
            <aside class="lg:w-72 shrink-0">
                <div class="lg:sticky lg:top-24 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs max-h-[calc(100vh-7rem)] overflow-y-auto">
                    <!-- Quick Guide Switcher inside Sidebar -->
                    <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl mb-4 text-xs font-bold">
                        <button type="button"
                                @click="selectGuide('exam')"
                                :class="activeGuide === 'exam' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                                class="py-1.5 px-2 rounded-lg transition cursor-pointer truncate flex items-center justify-center gap-1.5">
                            <i class="fas fa-graduation-cap text-[10px]"></i>
                            <span x-text="lang === 'fr' ? 'Mode Examen' : 'Exam Mode'"></span>
                        </button>
                        <button type="button"
                                @click="selectGuide('practice')"
                                :class="activeGuide === 'practice' ? 'bg-teal-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                                class="py-1.5 px-2 rounded-lg transition cursor-pointer truncate flex items-center justify-center gap-1.5">
                            <i class="fas fa-qrcode text-[10px]"></i>
                            <span x-text="lang === 'fr' ? 'Entraînement QR' : 'Practice QR'"></span>
                        </button>
                    </div>

                    <div class="flex items-center justify-between mb-2">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-400" x-text="t.toc_title"></div>
                    </div>

                    <nav class="space-y-1 text-sm">
                        <template x-for="(sec, idx) in filteredSections" :key="sec.id">
                            <div>
                                <template x-if="sec.partHeader">
                                    <div class="pt-2 pb-1 px-2 text-[11px] font-extrabold uppercase tracking-wider"
                                         :class="sec.partColor === 'teal' ? 'text-teal-700' : sec.partColor === 'indigo' ? 'text-indigo-700' : 'text-slate-500'"
                                         x-text="sec.partHeader"></div>
                                </template>
                                <!-- Special Sidebar Styling for FAQ -->
                                <template x-if="sec.isFaq">
                                    <div class="mt-3 pt-3 border-t border-slate-200">
                                        <a :href="'#' + sec.id"
                                           class="flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl bg-amber-50/90 hover:bg-amber-100 border border-amber-200/80 text-amber-950 font-bold transition shadow-2xs">
                                            <span class="flex items-center gap-2 truncate text-xs sm:text-sm">
                                                <i class="fas fa-question-circle text-amber-600 text-sm shrink-0"></i>
                                                <span class="truncate" x-text="sec.shortTitle"></span>
                                            </span>
                                            <span class="px-1.5 py-0.5 rounded-md text-[10px] font-extrabold uppercase bg-amber-200/70 text-amber-900 shrink-0">FAQ</span>
                                        </a>
                                    </div>
                                </template>
                                <!-- Standard Bullet Styling for Manual Chapters -->
                                <template x-if="!sec.isFaq">
                                    <a :href="'#' + sec.id"
                                       class="flex items-center gap-2.5 px-3 py-1.5 rounded-xl text-slate-700 hover:bg-slate-100 hover:text-slate-950 font-medium transition">
                                        <span class="w-2 h-2 rounded-full shrink-0"
                                              :class="sec.partColor === 'teal' ? 'bg-teal-500' : 'bg-indigo-500'"></span>
                                        <span class="truncate text-xs sm:text-sm" x-text="sec.shortTitle"></span>
                                    </a>
                                </template>
                            </div>
                        </template>
                    </nav>

                    <div class="mt-5 pt-4 border-t border-slate-100">
                        <div class="p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-100 text-xs text-indigo-950 space-y-2">
                            <div class="font-bold flex items-center gap-1.5 text-indigo-700">
                                <i class="fas fa-shield-alt"></i>
                                <span x-text="t.privacy_box_title"></span>
                            </div>
                            <p class="leading-relaxed text-slate-600" x-text="t.privacy_box_text"></p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Documentation Chapters -->
            <main class="flex-1 space-y-12 min-w-0">

                <template x-for="(sec, idx) in filteredSections" :key="sec.id">
                    <div class="space-y-4">
                        <template x-if="sec.partBanner">
                            <div class="pt-2 pb-1">
                                <div class="p-6 sm:p-7 rounded-2xl border shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                                     :class="sec.partColor === 'teal' ? 'bg-gradient-to-r from-teal-900 via-teal-800 to-slate-900 text-white border-teal-700' : sec.partColor === 'indigo' ? 'bg-gradient-to-r from-indigo-950 via-indigo-900 to-slate-900 text-white border-indigo-800' : 'bg-slate-900 text-white border-slate-800'">
                                    <div class="space-y-1.5">
                                        <div class="text-xs font-extrabold uppercase tracking-widest opacity-80" x-text="sec.partBanner.kicker"></div>
                                        <h2 class="text-xl sm:text-2xl font-extrabold" x-text="sec.partBanner.title"></h2>
                                        <p class="text-xs sm:text-sm opacity-90 leading-relaxed" x-text="sec.partBanner.desc"></p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <section :id="sec.id"
                                 class="scroll-mt-24 rounded-3xl border shadow-sm overflow-hidden"
                                 :class="sec.isFaq ? 'bg-amber-50/30 border-amber-200/90 ring-1 ring-amber-200/60 mt-10' : 'bg-white border-slate-200/90'">
                            <!-- Section Header -->
                            <div class="px-6 sm:px-8 py-6 border-b flex items-start gap-4"
                                 :class="sec.isFaq ? 'bg-gradient-to-r from-amber-500/15 via-amber-50 to-white border-amber-200/80' : 'bg-slate-50/80 border-slate-200/80'">
                                <template x-if="sec.isFaq">
                                    <div class="w-11 h-11 rounded-2xl bg-amber-500 text-white font-extrabold text-xl flex items-center justify-center shrink-0 shadow-sm">
                                        <i class="fas fa-question-circle"></i>
                                    </div>
                                </template>
                                <template x-if="!sec.isFaq">
                                    <div class="w-3.5 h-3.5 mt-2.5 rounded-full shrink-0 shadow-xs"
                                         :class="sec.partColor === 'teal' ? 'bg-teal-500 ring-4 ring-teal-100' : 'bg-indigo-600 ring-4 ring-indigo-100'"></div>
                                </template>
                                <div>
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="text-xs font-bold uppercase tracking-wider"
                                              :class="sec.isFaq ? 'text-amber-700' : sec.partColor === 'teal' ? 'text-teal-600' : 'text-indigo-600'"
                                              x-text="sec.tag"></span>
                                        <template x-if="sec.badge">
                                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold border"
                                                  :class="sec.isFaq ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-emerald-100 text-emerald-800 border-emerald-200'"
                                                  x-text="sec.badge"></span>
                                        </template>
                                    </div>
                                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-0.5" x-text="sec.title"></h2>
                                    <p class="text-sm sm:text-base text-slate-600 mt-1" x-text="sec.subtitle"></p>
                                </div>
                            </div>

                            <!-- Section Body -->
                            <div class="p-6 sm:p-8 space-y-6">
                                <!-- Overview paragraphs -->
                                <div class="space-y-3 text-slate-700 text-sm sm:text-base leading-relaxed">
                                    <template x-for="(p, pIdx) in sec.paragraphs" :key="pIdx">
                                        <p x-html="p"></p>
                                    </template>
                                </div>

                                <!-- Dynamic Language Screenshot(s) -->
                                <template x-if="sec.screenshots && sec.screenshots.length > 0">
                                    <div class="space-y-6 pt-2">
                                        <template x-for="(shot, sIdx) in sec.screenshots" :key="sIdx">
                                            <figure class="rounded-2xl border border-slate-200 bg-slate-900/5 p-2 sm:p-3 shadow-md">
                                                <div class="flex items-center justify-between px-2 pb-2 text-xs text-slate-500">
                                                    <span class="font-semibold text-slate-700 flex items-center gap-1.5">
                                                        <i class="fas fa-desktop" :class="sec.partColor === 'teal' ? 'text-teal-600' : 'text-indigo-600'"></i>
                                                        <span x-text="shot.caption"></span>
                                                    </span>
                                                    <span class="font-mono text-[11px] px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-600" x-text="lang === 'fr' ? 'Interface FR' : 'EN Interface'"></span>
                                                </div>
                                                <img :src="'manual-assets/' + shot.filePrefix + '_' + lang + '.png'"
                                                     :alt="shot.caption"
                                                     loading="lazy"
                                                     class="w-full rounded-xl border border-slate-200 shadow-sm bg-white">
                                            </figure>
                                        </template>
                                    </div>
                                </template>

                                <!-- Numbered Key Callouts / Bullets -->
                                <template x-if="sec.callouts && sec.callouts.length > 0">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                        <template x-for="(c, cIdx) in sec.callouts" :key="cIdx">
                                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-start gap-3">
                                                <span class="w-6 h-6 rounded-full text-white font-bold text-xs flex items-center justify-center shrink-0 mt-0.5"
                                                      :class="sec.partColor === 'teal' ? 'bg-teal-600' : 'bg-indigo-600'"
                                                      x-text="cIdx + 1"></span>
                                                <div class="text-xs sm:text-sm">
                                                    <div class="font-bold text-slate-900 mb-0.5" x-text="c.title"></div>
                                                    <p class="text-slate-600 leading-relaxed" x-html="c.desc"></p>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Provider API Key Creation Cards -->
                                <template x-if="sec.providerGuides && sec.providerGuides.length > 0">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2">
                                        <template x-for="(pg, pgIdx) in sec.providerGuides" :key="pgIdx">
                                            <div class="p-5 rounded-2xl border border-slate-200 bg-slate-50/70 flex flex-col justify-between space-y-3">
                                                <div class="space-y-2">
                                                    <div class="flex items-center justify-between gap-2">
                                                        <h3 class="font-extrabold text-slate-900 text-base flex items-center gap-2">
                                                            <i :class="pg.icon" class="text-indigo-600"></i>
                                                            <span x-text="pg.name"></span>
                                                        </h3>
                                                        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-indigo-100 text-indigo-800 border border-indigo-200" x-text="pg.tag"></span>
                                                    </div>
                                                    <p class="text-xs sm:text-sm text-slate-600 leading-relaxed" x-html="pg.desc"></p>
                                                    <ol class="list-decimal list-inside space-y-1 text-xs text-slate-700 pt-1">
                                                        <template x-for="(st, stIdx) in pg.steps" :key="stIdx">
                                                            <li x-html="st"></li>
                                                        </template>
                                                    </ol>
                                                </div>
                                                <template x-if="pg.url">
                                                    <div class="pt-2 border-t border-slate-200/80">
                                                        <a :href="pg.url" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition">
                                                            <span x-text="pg.linkLabel"></span>
                                                            <i class="fas fa-external-link-alt text-[10px]"></i>
                                                        </a>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- FAQ Cards -->
                                <template x-if="sec.faqs && sec.faqs.length > 0">
                                    <div class="space-y-4 pt-2">
                                        <template x-for="(faq, fIdx) in sec.faqs" :key="fIdx">
                                            <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-2">
                                                <h3 class="text-base font-extrabold text-slate-900 flex items-start gap-2.5">
                                                    <span class="w-6 h-6 rounded-lg bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">Q</span>
                                                    <span x-text="faq.q"></span>
                                                </h3>
                                                <div class="pl-8 text-xs sm:text-sm text-slate-700 leading-relaxed space-y-2" x-html="faq.a"></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Pedagogical Tip Box -->
                                <template x-if="sec.tip">
                                    <div class="p-4 sm:p-5 rounded-2xl bg-amber-50/80 border border-amber-200/90 flex items-start gap-3.5 text-xs sm:text-sm text-amber-950">
                                        <i class="fas fa-lightbulb text-amber-600 text-lg shrink-0 mt-0.5"></i>
                                        <div>
                                            <div class="font-bold mb-0.5" x-text="sec.tip.title"></div>
                                            <p class="leading-relaxed text-amber-900/90" x-text="sec.tip.text"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>
                    </div>
                </template>

                <!-- Switch Guide Bottom Navigation Card -->
                <div x-show="activeGuide === 'exam' || activeGuide === 'practice'" class="p-6 sm:p-8 rounded-3xl border border-slate-200 bg-white shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-400" x-text="t.switch_guide_kicker"></div>
                        <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 mt-0.5"
                            x-text="activeGuide === 'exam' ? t.card_practice_title : t.card_exam_title"></h3>
                        <p class="text-xs sm:text-sm text-slate-600 mt-1"
                           x-text="activeGuide === 'exam' ? t.card_practice_desc : t.card_exam_desc"></p>
                    </div>
                    <button type="button"
                            @click="selectGuide(activeGuide === 'exam' ? 'practice' : 'exam'); window.scrollTo({top: 0, behavior: 'smooth'})"
                            :class="activeGuide === 'exam' ? 'bg-teal-600 hover:bg-teal-700' : 'bg-indigo-600 hover:bg-indigo-700'"
                            class="px-5 py-3 rounded-xl text-white font-bold text-sm shadow-md transition shrink-0 cursor-pointer flex items-center gap-2">
                        <span x-text="activeGuide === 'exam' ? t.btn_go_practice : t.btn_go_exam"></span>
                        <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </div>

            </main>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm">
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">G</div>
                <span class="font-bold text-white">Gradaly.io</span>
                <span class="text-xs text-slate-500">— v4.0.0</span>
            </div>
            <div class="flex items-center gap-6">
                <a href="index.html" class="hover:text-white transition" x-text="t.back_home"></a>
                <a href="index.html#download" class="hover:text-white transition" x-text="t.download_btn"></a>
            </div>
        </div>
    </footer>

    <script src="manual.js?v=4.0.3"></script>
</body>
</html>
